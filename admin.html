<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - 15 Años Rossibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #064e3b 0%, #022c22 50%, #000000 100%);
            color: #fff;
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* PANTALLA DE LOGIN CON USUARIO Y CONTRASEÑA */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 44, 34, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .login-box {
            background: rgba(15, 23, 42, 0.95);
            padding: 35px 30px;
            border-radius: 20px;
            border: 2px solid rgba(212, 175, 55, 0.6);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 30px rgba(110, 231, 183, 0.2);
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        .login-box h2 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            margin-top: 0;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(2, 44, 34, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-box button {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1rem;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        #loginError {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* CONTENIDO PRINCIPAL */
        #adminMainContent {
            display: none;
        }

        .header-banner {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 15px;
            position: relative;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        .subtitle {
            color: #34d399;
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        .logout-btn {
            position: absolute;
            right: 0;
            top: 0;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: #fff;
        }

        /* PESTAÑAS DE NAVEGACIÓN ADMIN */
        .admin-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-btn {
            background: rgba(15, 23, 42, 0.8);
            color: #cbd5e1;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .section-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-container.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .card img:hover {
            opacity: 0.85;
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
        }

        .card-body h3 {
            margin: 0 0 5px 0;
            color: #ffd700;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
        }

        .card-body p {
            margin: 0 0 10px 0;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-style: italic;
        }

        .card-actions {
            padding: 12px 15px;
            background: rgba(2, 44, 34, 0.4);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .btn-approve {
            background: #34d399;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: background 0.2s;
        }

        .btn-approve:hover {
            background: #059669;
            color: #fff;
        }

        .btn-revert {
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: background 0.2s;
        }

        .btn-revert:hover {
            background: #d97706;
            color: #fff;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #cbd5e1;
            font-size: 1.1rem;
            padding: 50px 20px;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 16px;
            border: 2px dashed rgba(212, 175, 55, 0.3);
            font-family: 'Cinzel', serif;
        }

        /* MODAL DE AMPLIACIÓN DE IMAGEN */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        #modalImg {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 12px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
            object-fit: contain;
        }

        .close-modal {
            margin-top: 15px;
            background: #ffd700;
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO CON USUARIO Y CLAVE -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Acceso Administrador</h2>
            <form id="loginForm">
                <input type="text" id="adminUser" placeholder="Usuario" required>
                <input type="password" id="adminPassword" placeholder="Contraseña" required>
                <button type="submit">Entrar al Panel 🔒</button>
                <div id="loginError">Usuario o contraseña incorrectos.</div>
            </form>
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL DEL ADMIN -->
    <div id="adminMainContent">
        <div class="header-banner">
            <button class="logout-btn" id="logoutBtn">Cerrar Sesión 🚪</button>
            <h1>Panel de Control</h1>
            <div class="subtitle">MODERACIÓN DE FOTOS • BOSQUE ENCANTADO</div>
        </div>

        <!-- BOTONES DE PESTAÑAS -->
        <div class="admin-tabs">
            <button class="tab-btn active" id="tabPendientesBtn">📸 Pendientes (<span id="countPendientes">0</span>)</button>
            <button class="tab-btn" id="tabAprobadasBtn">✨ Aprobadas en Galería (<span id="countAprobadas">0</span>)</button>
        </div>

        <!-- SECCIÓN DE FOTOS PENDIENTES -->
        <div class="section-container active" id="sectionPendientes">
            <div class="grid" id="adminGridPendientes">
                <div class="empty-state">No hay fotos pendientes de aprobación. ✨</div>
            </div>
        </div>

        <!-- SECCIÓN DE FOTOS APROBADAS -->
        <div class="section-container" id="sectionAprobadas">
            <div class="grid" id="adminGridAprobadas">
                <div class="empty-state">No hay fotos aprobadas todavía. 🌿</div>
            </div>
        </div>
    </div>

    <!-- MODAL DE AMPLIACIÓN DE IMAGEN -->
    <div id="imageModal">
        <img id="modalImg" src="" alt="Vista previa ampliada">
        <button class="close-modal" id="closeModalBtn">Cerrar ✖</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CREDENCIALES CONFIGURADAS (Usuario: rafael / Clave: 1947)
        const ADMIN_USER = "rafael";
        const ADMIN_PASS = "1947";

        const loginOverlay = document.getElementById('loginOverlay');
        const loginForm = document.getElementById('loginForm');
        const adminUser = document.getElementById('adminUser');
        const adminPassword = document.getElementById('adminPassword');
        const loginError = document.getElementById('loginError');
        const adminMainContent = document.getElementById('adminMainContent');
        const logoutBtn = document.getElementById('logoutBtn');

        // Verificar si ya inició sesión en esta pestaña
        if (sessionStorage.getItem("adminLoggedIn") === "true") {
            loginOverlay.style.display = 'none';
            adminMainContent.style.display = 'block';
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (adminUser.value.trim().toLowerCase() === ADMIN_USER && adminPassword.value === ADMIN_PASS) {
                sessionStorage.setItem("adminLoggedIn", "true");
                loginOverlay.style.display = 'none';
                adminMainContent.style.display = 'block';
            } else {
                loginError.style.display = 'block';
                adminPassword.value = '';
            }
        });

        logoutBtn.addEventListener('click', () => {
            sessionStorage.removeItem("adminLoggedIn");
            location.reload();
        });

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Control de Pestañas
        const tabPendientesBtn = document.getElementById('tabPendientesBtn');
        const tabAprobadasBtn = document.getElementById('tabAprobadasBtn');
        const sectionPendientes = document.getElementById('sectionPendientes');
        const sectionAprobadas = document.getElementById('sectionAprobadas');

        tabPendientesBtn.addEventListener('click', () => {
            tabPendientesBtn.classList.add('active');
            tabAprobadasBtn.classList.remove('active');
            sectionPendientes.classList.add('active');
            sectionAprobadas.classList.remove('active');
        });

        tabAprobadasBtn.addEventListener('click', () => {
            tabAprobadasBtn.classList.add('active');
            tabPendientesBtn.classList.remove('active');
            sectionAprobadas.classList.add('active');
            sectionPendientes.classList.remove('active');
        });

        const adminGridPendientes = document.getElementById('adminGridPendientes');
        const adminGridAprobadas = document.getElementById('adminGridAprobadas');
        const countPendientes = document.getElementById('countPendientes');
        const countAprobadas = document.getElementById('countAprobadas');

        // Modal Elements
        const imageModal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeModalBtn = document.getElementById('closeModalBtn');

        function openModal(imgSrc) {
            modalImg.src = imgSrc;
            imageModal.style.display = 'flex';
        }

        closeModalBtn.addEventListener('click', () => {
            imageModal.style.display = 'none';
        });

        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                imageModal.style.display = 'none';
            }
        });

        // Escuchar Fotos Pendientes
        onSnapshot(query(collection(db, "fotos"), where("status", "==", "pending")), (snapshot) => {
            adminGridPendientes.innerHTML = '';
            countPendientes.textContent = snapshot.size;

            if (snapshot.empty) {
                adminGridPendientes.innerHTML = '<div class="empty-state">No hay fotos pendientes de aprobación. ✨</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto pendiente" class="preview-trigger">
                    <div class="card-body">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-approve" data-id="${docSnap.id}">Aprobar ✨</button>
                        <button class="btn-delete" data-id="${docSnap.id}">Rechazar 🗑️</button>
                    </div>
                `;

                card.querySelector('.preview-trigger').addEventListener('click', () => {
                    openModal(data.imageUrl);
                });

                card.querySelector('.btn-approve').addEventListener('click', async () => {
                    await updateDoc(doc(db, "fotos", docSnap.id), { status: "approved" });
                });

                card.querySelector('.btn-delete').addEventListener('click', async () => {
                    if (confirm("¿Estás seguro de rechazar y eliminar esta foto?")) {
                        await deleteDoc(doc(db, "fotos", docSnap.id));
                    }
                });

                adminGridPendientes.appendChild(card);
            });
        });

        // Escuchar Fotos Aprobadas
        onSnapshot(query(collection(db, "fotos"), where("status", "==", "approved")), (snapshot) => {
            adminGridAprobadas.innerHTML = '';
            countAprobadas.textContent = snapshot.size;

            if (snapshot.empty) {
                adminGridAprobadas.innerHTML = '<div class="empty-state">No hay fotos aprobadas todavía. 🌿</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto aprobada" class="preview-trigger">
                    <div class="card-body">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-revert" data-id="${docSnap.id}">Revertir ↩️</button>
                        <button class="btn-delete" data-id="${docSnap.id}">Eliminar 🗑️</button>
                    </div>
                `;

                card.querySelector('.preview-trigger').addEventListener('click', () => {
                    openModal(data.imageUrl);
                });

                card.querySelector('.btn-revert').addEventListener('click', async () => {
                    if (confirm("¿Deseas devolver esta foto a pendientes?")) {
                        await updateDoc(doc(db, "fotos", docSnap.id), { status: "pending" });
                    }
                });

                card.querySelector('.btn-delete').addEventListener('click', async () => {
                    if (confirm("¿Estás seguro de eliminar permanentemente esta foto de la galería?")) {
                        await deleteDoc(doc(db, "fotos", docSnap.id));
                    }
                });

                adminGridAprobadas.appendChild(card);
            });
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
