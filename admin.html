<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - 15 Años Rossibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #064e3b 0%, #022c22 50%, #000000 100%);
            color: #fff;
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-banner {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 15px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
        }

        .subtitle {
            color: #34d399;
            font-size: 0.9rem;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        /* PESTAÑAS DE NAVEGACIÓN ADMIN */
        .admin-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: rgba(15, 23, 42, 0.8);
            color: #cbd5e1;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .section-container {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }

        .section-container.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(15, 23, 42, 0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
        }

        .card-body {
            padding: 15px;
            flex-grow: 1;
        }

        .card-body h3 {
            margin: 0 0 5px 0;
            color: #ffd700;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
        }

        .card-body p {
            margin: 0 0 10px 0;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-style: italic;
        }

        .video-link-box {
            background: rgba(2, 44, 34, 0.6);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .video-link-box a {
            color: #34d399;
            font-size: 0.85rem;
            text-decoration: underline;
        }

        .card-actions {
            padding: 12px 15px;
            background: rgba(2, 44, 34, 0.4);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .btn-approve {
            background: #34d399;
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: background 0.2s;
        }

        .btn-approve:hover {
            background: #059669;
            color: #fff;
        }

        .btn-delete {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            flex: 1;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            transition: background 0.2s;
        }

        .btn-delete:hover {
            background: #dc2626;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #cbd5e1;
            font-size: 1.1rem;
            padding: 50px 20px;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 16px;
            border: 2px dashed rgba(212, 175, 55, 0.3);
            font-family: 'Cinzel', serif;
        }
    </style>
</head>
<body>

    <div class="header-banner">
        <h1>Panel de Control</h1>
        <div class="subtitle">MODERACIÓN DE CONTENIDO • BOSQUE ENCANTADO</div>
    </div>

    <!-- BOTONES DE PESTAÑAS -->
    <div class="admin-tabs">
        <button class="tab-btn active" id="tabFotosBtn">📸 Moderar Fotos (<span id="countFotos">0</span>)</button>
        <button class="tab-btn" id="tabVideosBtn">🎥 Moderar Videos (<span id="countVideos">0</span>)</button>
    </div>

    <!-- SECCIÓN DE FOTOS PENDIENTES -->
    <div class="section-container active" id="sectionFotos">
        <div class="grid" id="adminGridFotos">
            <div class="empty-state">No hay fotos pendientes de aprobación. ✨</div>
        </div>
    </div>

    <!-- SECCIÓN DE VIDEOS PENDIENTES -->
    <div class="section-container" id="sectionVideos">
        <div class="grid" id="adminGridVideos">
            <div class="empty-state">No hay saludos en video pendientes de aprobación. 🎥</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Control de Pestañas
        const tabFotosBtn = document.getElementById('tabFotosBtn');
        const tabVideosBtn = document.getElementById('tabVideosBtn');
        const sectionFotos = document.getElementById('sectionFotos');
        const sectionVideos = document.getElementById('sectionVideos');

        tabFotosBtn.addEventListener('click', () => {
            tabFotosBtn.classList.add('active');
            tabVideosBtn.classList.remove('active');
            sectionFotos.classList.add('active');
            sectionVideos.classList.remove('active');
        });

        tabVideosBtn.addEventListener('click', () => {
            tabVideosBtn.classList.add('active');
            tabFotosBtn.classList.remove('active');
            sectionVideos.classList.add('active');
            sectionFotos.classList.remove('active');
        });

        const adminGridFotos = document.getElementById('adminGridFotos');
        const adminGridVideos = document.getElementById('adminGridVideos');
        const countFotos = document.getElementById('countFotos');
        const countVideos = document.getElementById('countVideos');

        // Escuchar Fotos Pendientes
        onSnapshot(query(collection(db, "fotos"), where("status", "==", "pending")), (snapshot) => {
            adminGridFotos.innerHTML = '';
            countFotos.textContent = snapshot.size;

            if (snapshot.empty) {
                adminGridFotos.innerHTML = '<div class="empty-state">No hay fotos pendientes de aprobación. ✨</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto pendiente">
                    <div class="card-body">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-approve" data-id="${docSnap.id}">Aprobar ✨</button>
                        <button class="btn-delete" data-id="${docSnap.id}">Rechazar 🗑️</button>
                    </div>
                `;

                card.querySelector('.btn-approve').addEventListener('click', async () => {
                    await updateDoc(doc(db, "fotos", docSnap.id), { status: "approved" });
                });

                card.querySelector('.btn-delete').addEventListener('click', async () => {
                    if (confirm("¿Estás seguro de rechazar y eliminar esta foto?")) {
                        await deleteDoc(doc(db, "fotos", docSnap.id));
                    }
                });

                adminGridFotos.appendChild(card);
            });
        });

        // Escuchar Videos Pendientes
        onSnapshot(query(collection(db, "videos"), where("status", "==", "pending")), (snapshot) => {
            adminGridVideos.innerHTML = '';
            countVideos.textContent = snapshot.size;

            if (snapshot.empty) {
                adminGridVideos.innerHTML = '<div class="empty-state">No hay saludos en video pendientes de aprobación. 🎥</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-body" style="padding-top:20px;">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                        <div class="video-link-box">
                            <strong>Enlace:</strong><br>
                            <a href="${data.videoUrl}" target="_blank">${data.videoUrl}</a>
                        </div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-approve" data-id="${docSnap.id}">Aprobar 🎥</button>
                        <button class="btn-delete" data-id="${docSnap.id}">Rechazar 🗑️</button>
                    </div>
                `;

                card.querySelector('.btn-approve').addEventListener('click', async () => {
                    await updateDoc(doc(db, "videos", docSnap.id), { status: "approved" });
                });

                card.querySelector('.btn-delete').addEventListener('click', async () => {
                    if (confirm("¿Estás seguro de rechazar y eliminar este video?")) {
                        await deleteDoc(doc(db, "videos", docSnap.id));
                    }
                });

                adminGridVideos.appendChild(card);
            });
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
