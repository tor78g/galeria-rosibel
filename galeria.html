<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería en Vivo - 15 Años Rossibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #064e3b 0%, #022c22 50%, #000000 100%);
            color: #fff;
            margin: 0;
            padding: 25px 15px;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        .header-banner {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.4);
            padding: 30px 15px 25px 15px;
            position: relative;
            overflow: hidden; /* Mantiene las luciérnagas confinadas en la parte superior */
            border-radius: 0 0 16px 16px;
            background: rgba(2, 44, 34, 0.3);
        }

        /* LUCIÉRNAGAS CONFINADAS Y FLOTANDO SOLO EN EL ENCABEZADO */
        .magic-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255,215,0,1) 0%, rgba(52,211,153,0.8) 50%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle linear infinite;
            box-shadow: 0 0 10px rgba(255,215,0,0.9), 0 0 18px rgba(52,211,153,0.6);
            z-index: 1;
        }

        @keyframes floatParticle {
            0% {
                transform: translateY(120px) translateX(0) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.9;
            }
            80% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-30px) translateX(40px) scale(1.4);
                opacity: 0;
            }
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            position: relative;
            z-index: 2;
        }

        .subtitle {
            color: #34d399;
            font-size: 0.95rem;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
            position: relative;
            z-index: 2;
        }

        /* BOTÓN FLOTANTE ESTILIZADO */
        .btn-subir-flotante {
            position: absolute;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.85rem;
            padding: 10px 16px;
            border-radius: 20px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 3;
        }

        .btn-subir-flotante:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .card {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(52, 211, 153, 0.15);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #34d399;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85), 0 0 25px rgba(52, 211, 153, 0.35);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            transition: transform 0.5s ease;
        }

        .card:hover img {
            transform: scale(1.03);
        }

        .card-body {
            padding: 15px 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(2, 44, 34, 0.9));
        }

        .card-body h3 {
            margin: 0 0 5px 0;
            color: #ffd700;
            font-size: 1.05rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 0.5px;
        }

        .card-body p {
            margin: 0;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-style: italic;
            line-height: 1.3;
        }

        #modalViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #modalViewer img {
            max-width: 90%;
            max-height: 65vh;
            border-radius: 12px;
            border: 2px solid #ffd700;
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.6);
            object-fit: contain;
        }

        .modal-info {
            text-align: center;
            margin-top: 20px;
            max-width: 90%;
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.4);
        }

        .modal-info h2 {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            margin: 0 0 8px 0;
            font-size: 1.4rem;
        }

        .modal-info p {
            color: #cbd5e1;
            font-size: 1.1rem;
            margin: 0;
            font-style: italic;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            background: #ffd700;
            color: #000;
            border: none;
            font-size: 1.8rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            transition: transform 0.2s;
        }

        .close-btn:hover {
            transform: scale(1.1);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #cbd5e1;
            font-size: 1.2rem;
            padding: 60px 20px;
            background: rgba(15, 23, 42, 0.7);
            border-radius: 16px;
            border: 2px dashed rgba(212, 175, 55, 0.4);
            font-family: 'Cinzel', serif;
        }

        @media (max-width: 768px) {
            .header-banner {
                padding: 20px 10px;
            }
            .btn-subir-flotante {
                position: relative;
                top: auto;
                right: auto;
                margin: 12px auto 0 auto;
                display: inline-flex;
            }
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .card img {
                height: 150px;
            }
            .card-body {
                padding: 10px;
            }
            .card-body h3 {
                font-size: 0.9rem;
            }
            .card-body p {
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="header-banner" id="bannerHeader">
        <a href="index.html" class="btn-subir-flotante">📸 Subir Otra Foto</a>
        <h1>Bosque Encantado</h1>
        <div class="subtitle">MIS 15 AÑOS ROSSIBEL • GALERÍA EN VIVO</div>
    </div>

    <!-- SCRIPT DE LUCIÉRNAGAS DENTRO DEL ENCABEZADO -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const banner = document.getElementById('bannerHeader');
            const particleCount = 20;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'magic-particle';
                const size = Math.random() * 8 + 6;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 3 + 2.5}s`;
                particle.style.animationDelay = `${Math.random() * 3}s`;
                banner.appendChild(particle);
            }
        });
    </script>
    
    <div class="grid" id="liveGrid">
        <div class="empty-state">Esperando las primeras fotos mágicas del evento... ✨</div>
    </div>

    <div id="modalViewer">
        <button class="close-btn" id="closeModal">&times;</button>
        <img id="modalImg" src="" alt="Foto ampliada">
        <div class="modal-info">
            <h2 id="modalSender"></h2>
            <p id="modalMsg"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const liveGrid = document.getElementById('liveGrid');
        const modalViewer = document.getElementById('modalViewer');
        const modalImg = document.getElementById('modalImg');
        const modalSender = document.getElementById('modalSender');
        const modalMsg = document.getElementById('modalMsg');
        const closeModal = document.getElementById('closeModal');

        const q = query(collection(db, "fotos"), where("status", "==", "approved"));

        onSnapshot(q, (snapshot) => {
            liveGrid.innerHTML = '';
            if (snapshot.empty) {
                liveGrid.innerHTML = '<div class="empty-state">Esperando las primeras fotos mágicas del evento... ✨</div>';
                return;
            }
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto del evento">
                    <div class="card-body">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                    </div>
                `;
                card.addEventListener('click', () => {
                    modalImg.src = data.imageUrl;
                    modalSender.textContent = data.senderName;
                    modalMsg.textContent = `"${data.message}"`;
                    modalViewer.style.display = 'flex';
                });
                liveGrid.appendChild(card);
            });
        });

        const cerrarModal = () => {
            modalViewer.style.display = 'none';
            modalImg.src = '';
        };

        closeModal.addEventListener('click', cerrarModal);
        modalViewer.addEventListener('click', (e) => { if (e.target === modalViewer) cerrarModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modalViewer.style.display === 'flex') cerrarModal(); });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
