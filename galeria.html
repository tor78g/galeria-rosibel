<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro en Vivo - 15 Años Rossibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #064e3b 0%, #022c22 50%, #000000 100%);
            color: #fff;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header-banner {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 15px;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 2rem;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }
        .subtitle {
            color: #6ee7b7;
            font-size: 0.9rem;
            letter-spacing: 2px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }
        .card-body {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .card-body h3 {
            margin: 0 0 5px 0;
            color: #d4af37;
            font-size: 1.1rem;
            font-family: 'Cinzel', serif;
        }
        .card-body p {
            margin: 0;
            color: #e2e8f0;
            font-size: 0.95rem;
            font-style: italic;
            line-height: 1.3;
        }

        /* VENTANA MODAL / ZOOM A PANTALLA COMPLETA */
        #modalViewer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 15px;
            box-sizing: border-box;
        }
        #modalViewer img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 10px;
            border: 2px solid #d4af37;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            object-fit: contain;
        }
        .modal-info {
            text-align: center;
            margin-top: 15px;
            max-width: 90%;
        }
        .modal-info h2 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            margin: 0 0 5px 0;
            font-size: 1.4rem;
        }
        .modal-info p {
            color: #e2e8f0;
            font-size: 1.05rem;
            margin: 0;
            font-style: italic;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #d4af37;
            color: #000;
            border: none;
            font-size: 1.8rem;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            font-size: 1.2rem;
            padding: 50px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            font-family: 'Cinzel', serif;
        }

        /* Ajustes específicos para pantallas grandes (PC / Proyector) */
        @media (min-width: 768px) {
            body { padding: 40px 20px; }
            h1 { font-size: 3rem; }
            .subtitle { font-size: 1.3rem; letter-spacing: 4px; }
            .empty-state { font-size: 1.5rem; padding: 80px; }
        }
    </style>
</head>
<body>
    <div class="header-banner">
        <h1>Bosque Encantado</h1>
        <div class="subtitle">MIS 15 AÑOS ROSSIBEL • GALERÍA EN VIVO</div>
    </div>
    
    <div class="grid" id="liveGrid">
        <div class="empty-state">Esperando las primeras fotos aprobadas del evento...</div>
    </div>

    <div id="modalViewer">
        <button class="close-btn" id="closeModal">&times;</button>
        <img id="modalImg" src="" alt="Foto ampliada">
        <div class="modal-info">
            <h2 id="modalSender"></h2>
            <p id="modalMsg"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const liveGrid = document.getElementById('liveGrid');
        const modalViewer = document.getElementById('modalViewer');
        const modalImg = document.getElementById('modalImg');
        const modalSender = document.getElementById('modalSender');
        const modalMsg = document.getElementById('modalMsg');
        const closeModal = document.getElementById('closeModal');

        const q = query(collection(db, "fotos"), where("status", "==", "approved"));

        onSnapshot(q, (snapshot) => {
            liveGrid.innerHTML = '';

            if (snapshot.empty) {
                liveGrid.innerHTML = '<div class="empty-state">Esperando las primeras fotos aprobadas del evento...</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto del evento">
                    <div class="card-body">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                    </div>
                `;

                card.addEventListener('click', () => {
                    modalImg.src = data.imageUrl;
                    modalSender.textContent = data.senderName;
                    modalMsg.textContent = `"${data.message}"`;
                    modalViewer.style.display = 'flex';
                });

                liveGrid.appendChild(card);
            });
        });

        const cerrarModal = () => {
            modalViewer.style.display = 'none';
            modalImg.src = '';
        };

        closeModal.addEventListener('click', cerrarModal);

        modalViewer.addEventListener('click', (e) => {
            if (e.target === modalViewer) {
                cerrarModal();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalViewer.style.display === 'flex') {
                cerrarModal();
            }
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
