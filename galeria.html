<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muro en Vivo - 15 Años Rosibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle, #022c22, #000000);
            color: #fff;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }
        .subtitle {
            text-align: center;
            color: #6ee7b7;
            font-size: 1.2rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(212, 175, 55, 0.3);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.8s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .card-body {
            padding: 20px;
        }
        .card-body h3 {
            margin: 0 0 8px 0;
            color: #d4af37;
            font-size: 1.2rem;
        }
        .card-body p {
            margin: 0;
            color: #e2e8f0;
            font-size: 1rem;
            font-style: italic;
        }
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            font-size: 1.3rem;
            padding: 60px;
        }
    </style>
</head>
<body>
    <h1>Bosque Encantado</h1>
    <div class="subtitle">COMPARTE TUS FOTOS • #Mis15Rosibel</div>
    
    <div class="grid" id="liveGrid">
        <div class="empty-state">Esperando las primeras fotos aprobadas del evento...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const liveGrid = document.getElementById('liveGrid');

        const q = query(collection(db, "fotos"), where("status", "==", "approved"), orderBy("timestamp", "desc"));

        onSnapshot(q, (snapshot) => {
            liveGrid.innerHTML = '';

            if (snapshot.empty) {
                liveGrid.innerHTML = '<div class="empty-state">Esperando las primeras fotos aprobadas del evento...</div>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${data.imageUrl}" alt="Foto del evento">
                    <div class="card-body">
                        <h3>${escapeHtml(data.senderName)}</h3>
                        <p>"${escapeHtml(data.message)}"</p>
                    </div>
                `;
                liveGrid.appendChild(card);
            });
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
