<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presentación en Vivo - 15 Años Rossibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at center, #064e3b 0%, #022c22 50%, #000000 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .header-banner {
            text-align: center;
            border-bottom: 2px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .subtitle {
            color: #6ee7b7;
            font-size: 1.1rem;
            letter-spacing: 3px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
        }

        /* CONTENEDOR DE LA DIAPOSITIVA */
        .slide-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            position: relative;
            padding: 10px;
        }
        .slide-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            max-width: 900px;
            width: 100%;
            height: 100%;
            animation: fadeIn 0.8s ease-in-out;
        }
        .slide-card img {
            max-width: 100%;
            max-height: 58vh;
            object-fit: contain;
            border-radius: 14px;
            border: 3px solid #d4af37;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.6);
            background: #000;
        }
        .slide-info {
            text-align: center;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            max-width: 800px;
        }
        .slide-info h2 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }
        .slide-info p {
            color: #e2e8f0;
            font-size: 1.2rem;
            margin: 0;
            font-style: italic;
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            font-size: 1.8rem;
            font-family: 'Cinzel', serif;
            padding: 50px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border: 1px dashed rgba(212, 175, 55, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="header-banner">
        <h1>Bosque Encantado</h1>
        <div class="subtitle">MIS 15 AÑOS ROSSIBEL • PRESENTACIÓN EN VIVO</div>
    </div>
    
    <div class="slide-container" id="slideContainer">
        <div class="empty-state">Esperando las primeras fotos aprobadas del evento...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const slideContainer = document.getElementById('slideContainer');
        
        let approvedPhotos = [];
        let currentIndex = 0;
        let slideInterval = null;

        const q = query(collection(db, "fotos"), where("status", "==", "approved"));

        onSnapshot(q, (snapshot) => {
            const newPhotos = [];
            snapshot.forEach((docSnap) => {
                newPhotos.push(docSnap.data());
            });

            approvedPhotos = newPhotos;

            if (approvedPhotos.length === 0) {
                slideContainer.innerHTML = '<div class="empty-state">Esperando las primeras fotos aprobadas del evento...</div>';
                if (slideInterval) clearInterval(slideInterval);
                return;
            }

            if (currentIndex >= approvedPhotos.length) {
                currentIndex = 0;
            }

            if (!slideInterval && approvedPhotos.length > 0) {
                renderCurrentSlide();
                slideInterval = setInterval(nextSlide, 8000);
            }
        });

        function renderCurrentSlide() {
            if (approvedPhotos.length === 0) return;

            const photo = approvedPhotos[currentIndex];

            slideContainer.innerHTML = `
                <div class="slide-card">
                    <img src="${photo.imageUrl}" alt="Foto del evento">
                    <div class="slide-info">
                        <h2>${escapeHtml(photo.senderName)}</h2>
                        <p>"${escapeHtml(photo.message)}"</p>
                    </div>
                </div>
            `;
        }

        function nextSlide() {
            if (approvedPhotos.length === 0) return;
            currentIndex = (currentIndex + 1) % approvedPhotos.length;
            renderCurrentSlide();
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
