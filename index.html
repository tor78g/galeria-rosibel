<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15 Años Rosibel - Subir Foto en Vivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #064e3b;
            --accent: #d4af37;
            --bg: #022c22;
            --card-bg: rgba(255, 255, 255, 0.95);
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg), var(--primary));
            color: #1f2937;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border: 2px solid var(--accent);
            box-sizing: border-box;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: var(--primary);
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: var(--accent);
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--primary);
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input[type="file"] {
            background: #f9fafb;
            cursor: pointer;
        }
        button {
            background: var(--accent);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #e6c547;
        }
        #status-msg {
            text-align: center;
            margin-top: 15px;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bosque Encantado</h1>
        <div class="subtitle">15 Años de Rosibel</div>
        
        <form id="uploadForm">
            <div class="form-group">
                <label for="guestName">Tu Nombre o Familia:</label>
                <input type="text" id="guestName" required placeholder="Ej. Familia Pérez / Tío Carlos">
            </div>
            <div class="form-group">
                <label for="guestMessage">Mensaje para Rosibel (Opcional):</label>
                <input type="text" id="guestMessage" placeholder="¡Felices 15 años!">
            </div>
            <div class="form-group">
                <label for="photoFile">Elige tu foto:</label>
                <input type="file" id="photoFile" accept="image/*" required>
            </div>
            <button type="submit" id="submitBtn">Enviar Foto a la Pantalla</button>
        </form>
        <div id="status-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-msg');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('guestName').value;
            const message = document.getElementById('guestMessage').value;
            const fileInput = document.getElementById('photoFile');
            const file = fileInput.files[0];

            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando foto...';
            statusMsg.style.color = '#064e3b';
            statusMsg.textContent = 'Preparando imagen...';

            try {
                // Convertir la imagen a Base64 para guardarla directo en Firestore sin Storage
                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                reader.onload = async function () {
                    const base64Image = reader.result;

                    await addDoc(collection(db, "fotos"), {
                        senderName: name,
                        message: message || "¡Felices 15 años!",
                        imageUrl: base64Image,
                        status: "pending",
                        timestamp: Date.now()
                    });

                    statusMsg.style.color = '#059669';
                    statusMsg.textContent = '¡Foto enviada con éxito! Pronto aparecerá en el evento.';
                    uploadForm.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Enviar Foto a la Pantalla';
                };

            } catch (error) {
                console.error("Error al subir:", error);
                statusMsg.style.color = '#dc2626';
                statusMsg.textContent = 'Hubo un error al enviar la foto. Inténtalo de nuevo.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Enviar Foto a la Pantalla';
            }
        });
    </script>
</body>
</html>
