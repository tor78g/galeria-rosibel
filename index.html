<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        const successBox = document.getElementById('successBox');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const senderName = document.getElementById('senderName').value;
            const message = document.getElementById('message').value;
            const fileInput = document.getElementById('photoFile');
            const file = fileInput.files[0];

            if (!file) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Preparando imagen... 🌟';
            statusMessage.textContent = 'Optimizando foto para el Bosque Encantado...';

            try {
                // Redimensionar y comprimir la imagen para evitar que pese demasiado
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = async () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 1000;
                        const MAX_HEIGHT = 1000;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Convertir a formato comprimido JPEG al 80% de calidad
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);

                        submitBtn.textContent = 'Subiendo al servidor... 🚀';
                        statusMessage.textContent = 'Guardando en la base de datos...';

                        await addDoc(collection(db, "fotos"), {
                            senderName: senderName,
                            message: message,
                            imageUrl: compressedBase64,
                            status: "approved",
                            createdAt: new Date()
                        });

                        uploadForm.style.display = 'none';
                        successBox.style.display = 'block';
                        statusMessage.textContent = '';
                    };
                };
            } catch (error) {
                console.error("Error al subir:", error);
                statusMessage.textContent = 'Hubo un error al subir la foto. Intenta con otra imagen.';
                submitBtn.disabled = false;
                submitBtn.textContent = '✨ Subir Mi Momento Mágico';
            }
        });

        window.resetForm = function() {
            uploadForm.reset();
            uploadForm.style.display = 'block';
            successBox.style.display = 'none';
            submitBtn.disabled = false;
            submitBtn.textContent = '✨ Subir Mi Momento Mágico';
            statusMessage.textContent = '';
        }
    </script>
