<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparte tu Foto - 15 Años Rossibel</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle, #022c22, #000000);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(212, 175, 55, 0.4);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
        }
        h1 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #6ee7b7;
            font-size: 0.9rem;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea { resize: vertical; height: 80px; }
        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }
        .btn-submit {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: 'Cinzel', serif;
        }
        .btn-submit:hover { opacity: 0.9; }
        #loading {
            display: none;
            text-align: center;
            color: #6ee7b7;
            margin-top: 15px;
            font-weight: 600;
        }
        
        /* PANTALLA DE AGRADECIMIENTO PROFESIONAL */
        #successScreen {
            display: none;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }
        #successScreen h2 {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        #successScreen p {
            color: #e2e8f0;
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .btn-another {
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-bottom: 15px;
        }
        .btn-another:hover {
            background: #d4af37;
            color: #000;
        }
        .keep-sharing-link {
            color: #6ee7b7;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
            border-bottom: 1px dashed #6ee7b7;
            padding-bottom: 2px;
            transition: color 0.2s;
        }
        .keep-sharing-link:hover {
            color: #34d399;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- FORMULARIO DE SUBIDA -->
        <div id="formContainer">
            <h1>Bosque Encantado</h1>
            <div class="subtitle">MIS 15 AÑOS ROSSIBEL</div>
            
            <form id="uploadForm">
                <div class="form-group">
                    <label>Tu Nombre o Familia:</label>
                    <input type="text" id="senderName" required placeholder="Ej. Familia Pérez">
                </div>
                <div class="form-group">
                    <label>Mensaje para Rossibel:</label>
                    <textarea id="message" required placeholder="Escribe un lindo deseo..."></textarea>
                </div>
                <div class="form-group">
                    <label>Selecciona tu Foto:</label>
                    <input type="file" id="imageFile" accept="image/*" required>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Enviar al Muro</button>
                <div id="loading">Optimizando y subiendo recuerdo...</div>
            </form>
        </div>

        <!-- PANTALLA DE AGRADECIMIENTO PROFESIONAL -->
        <div id="successScreen">
            <h2>¡Muchas Gracias!</h2>
            <p>Gracias por compartir momentos importantes en mi celebración de 15 Años.</p>
            <button class="btn-another" id="resetBtn">Subir otra foto</button>
            <div>
                <a href="#" class="keep-sharing-link" id="keepSharingLink">✨ Sigue compartiendo momentos</a>
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCTjyrFGjq5zr5hqnMT3qZX4sNuWZT3AJQ",
            authDomain: "rosibel15.firebaseapp.com",
            projectId: "rosibel15",
            storageBucket: "rosibel15.firebasestorage.app",
            messagingSenderId: "1042848632443",
            appId: "1:1042848632443:web:7b9ebf2da8bb21dd56dcde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const formContainer = document.getElementById('formContainer');
        const successScreen = document.getElementById('successScreen');
        const resetBtn = document.getElementById('resetBtn');
        const keepSharingLink = document.getElementById('keepSharingLink');

        // Función para comprimir y redimensionar la imagen automáticamente antes de convertirla a Base64
        function compressImage(file, maxWidth = 1200, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // Convertir a formato JPEG optimizado
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve(dataUrl);
                    };
                    img.onerror = (error) => reject(error);
                };
                reader.onerror = (error) => reject(error);
            });
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.style.display = 'none';
            loading.style.display = 'block';

            const senderName = document.getElementById('senderName').value;
            const message = document.getElementById('message').value;
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];

            if (!file) {
                alert("Por favor selecciona una foto.");
                loading.style.display = 'none';
                submitBtn.style.display = 'block';
                return;
            }

            try {
                // Comprimir la imagen antes de enviarla a Firebase
                const compressedBase64 = await compressImage(file, 1200, 0.7);

                await addDoc(collection(db, "fotos"), {
                    senderName: senderName,
                    message: message,
                    imageUrl: compressedBase64,
                    status: "pending",
                    timestamp: Date.now()
                });

                loading.style.display = 'none';
                uploadForm.reset();
                formContainer.style.display = 'none';
                successScreen.style.display = 'block';

            } catch (error) {
                console.error("Error al procesar o subir la foto:", error);
                alert("Hubo un error al enviar la foto. Intenta con otra imagen.");
                loading.style.display = 'none';
                submitBtn.style.display = 'block';
            }
        });

        const reiniciarFormulario = (e) => {
            if(e) e.preventDefault();
            successScreen.style.display = 'none';
            formContainer.style.display = 'block';
            submitBtn.style.display = 'block';
        };

        resetBtn.addEventListener('click', reiniciarFormulario);
        keepSharingLink.addEventListener('click', reiniciarFormulario);
    </script>
</body>
</html>
